# Démarrage manuel des listes reportées de l'enrichisseur v3 (bouton « Run workflow » dans l'onglet Actions de GitHub).
# Depuis le 16/10/2026, plus de réveil à heure fixe : c'est le scénario Make de la veille LinkedIn qui appelle /cron
# en fin de parcours, pour que l'enrichisseur ne tourne jamais en même temps qu'elle sur le compte LinkedIn.
# Mêmes règles que /cron : refusé de 9 h à 19 h en semaine (heure de Paris) et refusé si un run tourne déjà.
name: Réveil enrichisseur v3 (manuel)
on:
  workflow_dispatch: {}
jobs:
  reveil:
    runs-on: ubuntu-latest
    steps:
      - name: Lancer les listes reportées
        env:
          CLE: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 180 "https://enrichisseur-dirigeants.onrender.com/cron?cle=${CLE}"

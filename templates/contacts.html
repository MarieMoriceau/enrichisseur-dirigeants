<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nouveaux contacts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Roboto:wght@400;500;700&display=swap">
<style>
:root{
  --rouge:#B90009; --violet:#3C214B; --bleu:#77A1BA;
  --bg:#F4F3F6; --panel:#FFFFFF; --ink:#231829; --muted:#62596A; --line:#DEDAE3;
  --tag:#E8EFF4; --tag-ink:#3F667D; --accent:#B90009; --accent-soft:#F7E3E4;
  --ok:#1F7A4D; --ok-soft:#E3F2EA; --warn:#9A6200; --warn-soft:#FBF0DC;
  --display:"Source Serif 4",Georgia,serif;
  --body:Roboto,ui-sans-serif,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17111B; --panel:#221A28; --ink:#EEE9F2; --muted:#A99FB1; --line:#362B3E;
  --tag:#243441; --tag-ink:#A9C6D8; --accent:#E0474E; --accent-soft:#3A1A1F;
  --ok:#6FCF9C; --ok-soft:#173226; --warn:#E5B45C; --warn-soft:#352812; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17111B; --panel:#221A28; --ink:#EEE9F2; --muted:#A99FB1; --line:#362B3E;
  --tag:#243441; --tag-ink:#A9C6D8; --accent:#E0474E; --accent-soft:#3A1A1F;
  --ok:#6FCF9C; --ok-soft:#173226; --warn:#E5B45C; --warn-soft:#352812; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:var(--tag-ink)}
.band{background:var(--violet);color:#fff;border-bottom:4px solid var(--rouge)}
.band-in{padding:20px clamp(16px,3vw,40px) 22px;display:flex;align-items:center;gap:20px}
.logo{width:42px;height:auto;flex:none}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--bleu)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.6vw,32px);line-height:1.1;margin:2px 0 4px}
.sub{color:#D9D0E0;margin:0;font-size:14px}
.sub a{color:#D9D0E0}
.wrap{padding:22px clamp(16px,3vw,40px) 56px;display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:18px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.liste{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;padding:12px}
@media (max-width:900px){.liste{position:static;max-height:none}}
.filtres{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.filtres button{font:500 12.5px var(--body);border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
.filtres button[aria-pressed=true]{background:var(--violet);border-color:var(--violet);color:#fff}
input[type=search],input[type=text],select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);width:100%}
.items{overflow:auto;margin-top:10px;border-top:1px solid var(--line)}
.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:9px 6px;cursor:pointer}
.item:hover{background:var(--tag)}
.item[aria-current=true]{background:var(--tag);box-shadow:inset 3px 0 0 var(--rouge)}
.item b{font-weight:500;display:block}
.item small{color:var(--muted);font-size:12px}
.pill{font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:4px;background:var(--tag);color:var(--tag-ink);white-space:nowrap;display:inline-block}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.ko{background:var(--accent-soft);color:var(--accent)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.vide{color:var(--muted);padding:30px 10px;text-align:center}
.tete{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.tete h2{font-family:var(--display);font-weight:600;font-size:26px;margin:0}
.tete .meta{color:var(--muted);font-size:13px}
.etapes{display:flex;gap:6px;margin-bottom:16px}
.etapes button{font:500 14px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:8px 14px;cursor:pointer}
.etapes button[aria-pressed=true]{border-color:var(--violet);box-shadow:inset 0 -3px 0 var(--rouge)}
.etapes button:disabled{opacity:.45;cursor:not-allowed}
.etapes .num{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:4px;margin-right:6px}
h3{font-family:var(--display);font-weight:600;font-size:18px;margin:18px 0 8px}
.reco{background:var(--tag);border-radius:8px;padding:12px 14px;font-size:14px}
.reco b{font-weight:500}
.adresses{display:grid;gap:6px}
.adr{display:grid;grid-template-columns:auto 86px 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:6px;padding:9px 11px;cursor:pointer}
.adr:has(input:checked){border-color:var(--violet);background:var(--tag)}
.adr input[type=radio]{margin-top:4px;accent-color:var(--violet)}
.adr .src{font-weight:500;font-size:13px;color:var(--muted)}
.adr .txt{font-size:14.5px}
.adr .txt small{display:block;color:var(--muted);font-size:12px}
.adr.absente{opacity:.55;cursor:default}
.adr input[type=text]{padding:6px 9px}
.faits{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.fait{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fait span{display:block;font-size:12px;color:var(--muted)}
.fait b{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.2}
.fait p{margin:4px 0 0;font-size:13px}
.btn{font:500 14px var(--body);border:0;border-radius:6px;padding:10px 16px;cursor:pointer}
.btn.primary{background:var(--violet);color:#fff}.btn.primary:hover{background:var(--rouge)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:wait}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.msg{font-size:13.5px;color:var(--muted)}
.msg.err{color:var(--accent)}
.tab-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding:6px 8px}
td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
td small{display:block;color:var(--muted);font-size:12px}
td select{width:auto;padding:5px 8px;font-size:13px}
tr.parti td{background:var(--accent-soft)}
.note{font-size:13px;color:var(--muted);background:var(--tag);border-radius:6px;padding:8px 10px;margin-top:10px}
input:focus-visible,button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

table.saisie{min-width:980px}
table.saisie td{vertical-align:top}
table.saisie td:first-child{min-width:230px}
.edit{width:100%;font:inherit;font-size:13.5px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
select.edit{padding:6px 6px;min-width:150px}
.edit.modif{border-color:var(--warn);background:var(--warn-soft)}
.edit:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lien-li{font-size:12px;margin-left:4px}
tr.pret td{background:var(--ok-soft)}
tr.ecarte td{opacity:.55}
.boutons{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.boutons .btn{padding:6px 10px;font-size:13px}
.legende{font-size:12.5px;color:var(--muted);margin:4px 0 8px}
.legende i{display:inline-block;width:10px;height:10px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:2px;margin-right:4px;vertical-align:-1px}
.ro td{color:var(--muted)}
.deco{color:#D9D0E0;font-size:13px}
</style>
</head>

<script>
const ROLE = "{{ROLE}}";
const FILTRES = ["À traiter", "Terminées", "Toutes"];
let SOC = [], filtre = "À traiter", courant = null;
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = a => String(a || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
async function api(url, corps) {
  const r = await fetch(url, corps ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(corps)} : {});
  if (r.status === 401) { location.href = "/v3/connexion?suite=/v3/contacts"; throw new Error("reconnexion"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.erreur || ("erreur " + r.status));
  return j;
}
const finie = s => s.nb_nouveaux != null && s.nb_traites >= s.nb_nouveaux;
async function charger() {
  try { SOC = (await api("/v3/contacts/api/societes")).societes; }
  catch (e) { $("#items").innerHTML = `<div class="vide">${esc(e.message)}</div>`; return; }
  dessinerFiltres(); dessinerListe();
}
function dessinerFiltres() {
  const n = f => SOC.filter(s => f === "Toutes" || (f === "Terminées") === finie(s)).length;
  $("#filtres").innerHTML = FILTRES.map(f => `<button aria-pressed="${f === filtre}" data-f="${f}">${f} · ${n(f)}</button>`).join("");
  $("#filtres").querySelectorAll("button").forEach(b => b.onclick = () => { filtre = b.dataset.f; dessinerFiltres(); dessinerListe(); });
}
function visibles() {
  const q = norm($("#cherche").value);
  return SOC.filter(s => (filtre === "Toutes" || (filtre === "Terminées") === finie(s)) && (!q || norm(s.nom + " " + s.domaine).includes(q)));
}
function dessinerListe() {
  const v = visibles();
  $("#items").innerHTML = v.length ? v.map(s => `
    <button class="item" data-p="${s.page}" aria-current="${s.page === courant}">
      <b>${esc(s.nom)}</b>
      <small>${s.nb_nouveaux ?? "?"} nouveau(x) · ${s.nb_prets || 0} prêt(s) pour HubSpot · ${esc(s.traitee)}</small>
    </button>`).join("") : `<div class="vide">Rien ici.</div>`;
  $("#items").querySelectorAll(".item").forEach(b => b.onclick = () => ouvrir(b.dataset.p));
}
$("#cherche").oninput = dessinerListe;

let INFO = null;
async function ouvrir(page) {
  courant = page; dessinerListe();
  $("#detail").innerHTML = `<div class="vide">Lecture…</div>`;
  try { INFO = await api("/v3/contacts/api/societe/" + page); }
  catch (e) { $("#detail").innerHTML = `<div class="vide">${esc(e.message)}</div>`; return; }
  dessiner();
}

/* ─────────── tableau de saisie des nouveaux contacts (commun admin / négos) ─────────── */
const CHAMPS = ["linkedin", "fonction", "role", "email", "telephone"];
function champ(x, k, extra = "") {
  const m = (x.modifie || []).includes(k) ? " modif" : "";
  const ph = {linkedin: "https://www.linkedin.com/in/…", fonction: "Fonction", email: "prenom.nom@societe.fr", telephone: "06 12 34 56 78"}[k];
  const type = {email: "email", telephone: "tel", linkedin: "url"}[k] || "text";
  return `<input class="edit${m}" data-k="${k}" type="${type}" value="${esc(x[k] || "")}" placeholder="${ph}" aria-label="${k} de ${esc(x.nom_complet)}" ${extra}>`;
}
function selectRole(x, roles) {
  const opts = [...roles]; if (x.role && !opts.includes(x.role)) opts.unshift(x.role);
  const m = (x.modifie || []).includes("role") ? " modif" : "";
  return `<select class="edit${m}" data-k="role" aria-label="Rôle de ${esc(x.nom_complet)}"><option value="">—</option>${opts.map(o => `<option ${o === x.role ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
}
function ligneSaisie(x, i, roles, finDeLigne, societe) {
  const cls = x.etat === "prêt pour HubSpot" ? "pret" : x.etat === "écarté" ? "ecarte" : "";
  return `<tr id="l${i}" class="${cls}">
    <td><b>${esc(x.nom_complet)}</b>${x.linkedin ? `<a class="lien-li" href="${esc(x.linkedin)}" target="_blank" rel="noopener">ouvrir ↗</a>` : ""}
      <div style="margin-top:4px">${champ(x, "linkedin")}</div>
      ${x.ailleurs && x.ailleurs.id ? `<small>Déjà dans Pipedrive chez <b>${esc(x.ailleurs.org_nom)}</b> (fiche ${esc(x.ailleurs.id)})</small>` : ""}
      ${x.autres_societes && x.autres_societes.length ? `<small>Aussi dirigeant de : ${esc(x.autres_societes.join(", "))}</small>` : ""}
      ${x.lieu ? `<small>${esc(x.lieu)}</small>` : ""}</td>
    <td>${champ(x, "fonction")}</td>
    <td>${selectRole(x, roles)}</td>
    <td>${champ(x, "email")}${x.source_email && !(x.modifie || []).includes("email") ? `<small>trouvé par ${esc(x.source_email)}</small>` : ""}</td>
    <td>${champ(x, "telephone")}</td>
    <td>${finDeLigne(x, i)}<span class="msg" data-m="${i}"></span></td>
  </tr>`;
}
function tableSaisie(liste, roles, finDeLigne, titreFin) {
  return `<p class="legende"><i></i>case modifiée à la main (remplace la valeur trouvée par l'enrichisseur)</p>
    <div class="tab-wrap"><table class="saisie"><thead><tr><th>Contact et LinkedIn</th><th>Fonction</th><th>Rôle</th><th>E-mail</th><th>Téléphone</th><th>${titreFin}</th></tr></thead>
    <tbody>${liste.map((x, i) => ligneSaisie(x, i, roles, finDeLigne)).join("")}</tbody></table></div>`;
}
function champsLigne(i) {
  const o = {}; document.querySelectorAll(`#l${i} [data-k]`).forEach(e => o[e.dataset.k] = e.value.trim()); return o;
}
async function sauverContact(liste, i, etat, roles, finDeLigne, apres) {
  const x = liste[i], m = document.querySelector(`[data-m="${i}"]`);
  document.querySelectorAll(`#l${i} button`).forEach(b => b.disabled = true);
  m.textContent = "Enregistrement…"; m.className = "msg";
  try {
    const corps = {cle: x.cle, champs: champsLigne(i)}; if (etat) corps.etat = etat;
    const r = await api("/v3/contacts/api/contact/" + courant, corps);
    liste[i] = Object.assign({}, x, r);
    document.getElementById("l" + i).outerHTML = ligneSaisie(liste[i], i, roles, finDeLigne);
    const m2 = document.querySelector(`[data-m="${i}"]`); m2.textContent = "Enregistré"; m2.className = "msg";
    apres && apres(r);
  } catch (e) { m.textContent = e.message; m.className = "msg err"; document.querySelectorAll(`#l${i} button`).forEach(b => b.disabled = false); }
}

function finNegos(x, i) {
  const ailleurs = x.ailleurs && x.ailleurs.id;
  return x.etat === "à traiter"
    ? `<div class="boutons"><button class="btn primary" data-a="prêt pour HubSpot" data-i="${i}">${ailleurs ? "Ajouter à " + esc(INFO.nom) : "Valider pour HubSpot"}</button>
       <button class="btn ghost" data-a="écarté" data-i="${i}">Écarter</button>
       <button class="btn ghost" data-a="" data-i="${i}">Enregistrer</button></div>`
    : `<span class="pill ${x.etat === "écarté" ? "ko" : "ok"}">${esc(x.etat === "prêt pour HubSpot" && ailleurs ? "à ajouter" : x.etat)}${x.le ? " le " + esc(x.le.slice(0,10)) : ""}</span>
       <div class="boutons"><button class="btn ghost" data-a="" data-i="${i}">Enregistrer</button>
       <button class="btn ghost" data-a="à traiter" data-i="${i}">Annuler</button></div>`;
}
function brancher() {
  document.querySelectorAll("#nouveaux [data-a]").forEach(b => b.onclick = () =>
    sauverContact(INFO.nouveaux, +b.dataset.i, b.dataset.a || null, INFO.roles, finNegos, r => {
      const s = SOC.find(s => s.page === courant);
      if (s) { s.nb_prets = r.nb_prets; s.nb_traites = INFO.nouveaux.filter(n => n.etat !== "à traiter").length; }
      dessinerFiltres(); dessinerListe(); brancher();
    }));
}
function dessiner() {
  const s = INFO;
  $("#detail").innerHTML = `
    <div class="tete"><h2>${esc(s.nom)}</h2>
      <span class="meta">${[s.domaine ? `<a href="https://${esc(s.domaine)}" target="_blank" rel="noopener">${esc(s.domaine)}</a>` : "",
        s.effectif != null ? esc(s.effectif) + " salariés LinkedIn" : "", s.linkedin_societe ? `<a href="${esc(s.linkedin_societe)}" target="_blank" rel="noopener">page LinkedIn</a>` : ""].filter(Boolean).join(" · ")}</span></div>
    <p class="note">Bureaux : <b>${esc(s.adresse || "inconnue")}</b> ${s.adresse_validee ? `<span class="pill ok">adresse validée</span>` : `<span class="pill warn">adresse pas encore validée</span>`}</p>
    <h3>Nouveaux contacts <span class="pill">${s.nouveaux.length}</span></h3>
    <div id="nouveaux">${s.nouveaux.length ? tableSaisie(s.nouveaux, s.roles, finNegos, "Décision") : `<p class="msg">Aucun nouveau contact.</p>`}</div>
    <p class="note">Complétez ou corrigez librement (e-mail ou téléphone trouvé ailleurs, fonction, rôle, LinkedIn), puis « Valider pour HubSpot ». « Enregistrer » garde vos saisies sans décider.
      Un contact déjà dans Pipedrive ailleurs : vous dites s'il faut l'ajouter, Marie ou Michel décident ensuite s'il change de société.</p>
    <h3>Déjà au CRM <span class="pill">${s.crm.length}</span></h3>
    ${s.crm.length ? `<div class="tab-wrap"><table class="ro"><thead><tr><th>Contact</th><th>LinkedIn</th><th>Fonction</th><th>Contrôle</th></tr></thead><tbody>
      ${s.crm.map(x => `<tr><td>${esc(x.nom_complet)}</td><td>${x.linkedin ? `<a href="${esc(x.linkedin)}" target="_blank" rel="noopener">${esc(x.linkedin.replace(/^https?:\/\/(www\.)?/, ""))}</a>` : "—"}</td>
        <td>${esc(x.fonction)}</td><td>${esc(x.statut || "non contrôlé")}<small>${esc(x.detail)}</small></td></tr>`).join("")}
      </tbody></table></div><p class="note">Lecture seule : les contacts déjà au CRM sont gérés par Marie et Michel.</p>` : `<p class="msg">Aucun contact rattaché à cette société dans le CRM.</p>`}
    <p class="note">« Valider pour HubSpot » met le contact en attente d'envoi. L'envoi réel se fera après la migration HubSpot.</p>`;
  brancher();
}
charger();
</script>
